[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypeagent"
version = "0.1.0"
description = "LLM-powered persona agents for social platform seeding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "hypeagent contributors" }]
keywords = ["llm", "cli", "reddit", "social", "agents", "personas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
hypeagent = "hypeagent.cli.main:app"

[project.urls]
Homepage = "https://github.com/Ankk98/hypeagent"
Documentation = "https://github.com/Ankk98/hypeagent#readme"
Repository = "https://github.com/Ankk98/hypeagent"
Changelog = "https://github.com/Ankk98/hypeagent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["hypeagent"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "examples"
"platforms/README.md" = "platforms/README.md"
"tools/README.md" = "tools/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
